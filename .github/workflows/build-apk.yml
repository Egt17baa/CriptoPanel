name: Build APK

on:
  push:
    branches: [ccr-026d9d36-56wdts, ccr-0b385ebb-8z4419, claude/superpower-671dj6]
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default; only the job that publishes the release may write, and it never sees the signing key.
permissions:
  contents: read

# Actions are pinned to full commit SHAs (the tag in the comment): a moved or hijacked tag cannot run new code here.
jobs:
  # Build for sideloading: release (R8-optimised), signed with the private key from the repository secrets when
  # they exist; the shared test key is public (it is in the repo), so anyone could sign an "update" with it.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      # The secrets exist only inside this step (not in the job), so no other step or action can read them.
      - name: Test and build
        env:
          KEYSTORE_BASE64: ${{ secrets.CRIPTOPANEL_KEYSTORE_BASE64 }}
          CRIPTOPANEL_KEYSTORE_PASSWORD: ${{ secrets.CRIPTOPANEL_KEYSTORE_PASSWORD }}
          CRIPTOPANEL_KEY_ALIAS: ${{ secrets.CRIPTOPANEL_KEY_ALIAS }}
          CRIPTOPANEL_KEY_PASSWORD: ${{ secrets.CRIPTOPANEL_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
            export CRIPTOPANEL_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          else
            echo "::warning::Sin secretos de firma: el APK se firma con la clave de prueba pública. Ver docs/google-play/PUBLICAR.md"
          fi
          ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleRelease --no-daemon
          rm -f "$RUNNER_TEMP/upload.jks"

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk CriptoPanel.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CriptoPanel-apk
          path: CriptoPanel.apk

  # Publishes the download link. Can write releases, but has no access to the signing key.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: CriptoPanel-apk

      - name: Publish download link
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: apk-latest
          name: CriptoPanel (última versión)
          body: APK generado automáticamente desde ${{ github.ref_name }} (${{ github.sha }}). No es la versión de Google Play.
          prerelease: true
          files: CriptoPanel.apk

  # Google Play bundle, signed with your upload key. Runs on tags v* or manually,
  # once the repository secrets described in docs/google-play/PUBLICAR.md exist.
  play-bundle:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - name: Build signed bundle
        env:
          KEYSTORE_BASE64: ${{ secrets.CRIPTOPANEL_KEYSTORE_BASE64 }}
          CRIPTOPANEL_KEYSTORE_PASSWORD: ${{ secrets.CRIPTOPANEL_KEYSTORE_PASSWORD }}
          CRIPTOPANEL_KEY_ALIAS: ${{ secrets.CRIPTOPANEL_KEY_ALIAS }}
          CRIPTOPANEL_KEY_PASSWORD: ${{ secrets.CRIPTOPANEL_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Faltan los secretos de firma (CRIPTOPANEL_KEYSTORE_BASE64, ...). Ver docs/google-play/PUBLICAR.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          export CRIPTOPANEL_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          ./gradlew :app:bundleRelease -PversionCode=${{ github.run_number }} --no-daemon
          rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CriptoPanel-google-play-aab
          path: app/build/outputs/bundle/release/app-release.aab
