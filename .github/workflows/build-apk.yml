name: Build APK

on:
  push:
    branches: [ccr-026d9d36-56wdts, ccr-0b385ebb-8z4419]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Test build for sideloading: release (R8-optimised) signed with the shared test key.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Test and build
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk CriptoPanel.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CriptoPanel-apk
          path: CriptoPanel.apk

      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: CriptoPanel (última versión)
          body: APK de prueba generado automáticamente desde ${{ github.ref_name }} (${{ github.sha }}). No es la versión de Google Play.
          prerelease: true
          files: CriptoPanel.apk

  # Google Play bundle, signed with your upload key. Runs on tags v* or manually,
  # once the repository secrets described in docs/google-play/PUBLICAR.md exist.
  play-bundle:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.CRIPTOPANEL_KEYSTORE_BASE64 }}
      CRIPTOPANEL_KEYSTORE_PASSWORD: ${{ secrets.CRIPTOPANEL_KEYSTORE_PASSWORD }}
      CRIPTOPANEL_KEY_ALIAS: ${{ secrets.CRIPTOPANEL_KEY_ALIAS }}
      CRIPTOPANEL_KEY_PASSWORD: ${{ secrets.CRIPTOPANEL_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Check signing secrets
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Faltan los secretos de firma (CRIPTOPANEL_KEYSTORE_BASE64, ...). Ver docs/google-play/PUBLICAR.md"
            exit 1
          fi

      - name: Restore upload keystore
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > upload.jks
          echo "CRIPTOPANEL_KEYSTORE_FILE=upload.jks" >> "$GITHUB_ENV"

      - name: Build signed bundle
        run: ./gradlew :app:bundleRelease -PversionCode=${{ github.run_number }} --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: CriptoPanel-google-play-aab
          path: app/build/outputs/bundle/release/app-release.aab
