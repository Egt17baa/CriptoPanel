name: Build APK

on:
  push:
    branches: [ccr-026d9d36-56wdts, ccr-0b385ebb-8z4419]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Test and build
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CriptoPanel.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CriptoPanel-debug
          path: CriptoPanel.apk

      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: CriptoPanel (última versión)
          body: APK de depuración generado automáticamente desde la rama ${{ github.ref_name }} (${{ github.sha }}).
          prerelease: true
          files: CriptoPanel.apk
